backend:
  name: git-gateway
  repo: andrevvm/john-moods
  branch: live
  site_domain: stoic-kalam-384ed4.netlify.com

media_folder: "docs/images/uploads"

collections:
  - name: settings
    label: Content
    create: false
    files:
      - file: docs/_data/about.yml
        label: About
        name: about
        fields:
          - label: Text
            name: text
            widget: markdown
          - label: Background
            name: bg
            widget: color
          - label: Background image
            name: bg_img
            widget: image
      - file: docs/_data/videos.yml
        label: Videos
        name: videos
        fields:
          - label: Embeds
            name: embeds
            widget: markdown
      - file: docs/_data/music.yml
        label: Music
        name: music
        fields:
          - label: Content
            name: content
            widget: markdown
      - file: docs/_data/contact.yml
        label: Contact
        name: contact
        fields:
          - label: Text
            name: text
            widget: markdown
      - file: docs/_data/navigation.yml
        label: Navigation
        name: navigation
        fields:
          - label: Intro text
            name: intro_text
            widget: color
          - label: Navigation
            name: nav_items
            widget: list
            fields:
              - {label: Label, name: label, widget: string, required: false}
              - {label: Path, name: id, hint: "ID for page to open when clicked", widget: string, required: false}
              - { label: 'Text', name: 'text', widget: color, required: false }