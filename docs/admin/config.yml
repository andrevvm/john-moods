backend:
  name: github
  repo: andrevvm/john-moods
  branch: live
  site_domain: stoic-kalam-384ed4.netlify.com

media_folder: "images/uploads"

collections:
  - name: settings
    label: Content
    create: false
    files:
      - file: _data/about.yml
        label: About
        name: about
        fields:
          - label: Text
            name: text
            widget: markdown
          - label: Background
            name: bg
            widget: color
          - label: Background image
            name: bg_img
            widget: image
      - file: _data/videos.yml
        label: Videos
        name: videos
        fields:
          - label: Embeds
            name: embeds
            widget: markdown
      - file: _data/contact.yml
        label: Contact
        name: contact
        fields:
          - label: Text
            name: text
            widget: markdown
      - file: _data/navigation.yml
        label: Navigation
        name: navigation
        fields:
          - label: Intro background
            name: intro_bg
            widget: color
          - label: Intro text
            name: intro_text
            widget: color
          - label: Navigation
            name: nav_items
            widget: list
            fields:
              - {label: Label, name: label, widget: string, required: false}
              - {label: Path, name: id, hint: "ID for page to open when clicked", widget: string, required: false}
              - {label: Image, name: image, widget: image, required: false}
              - { label: 'Background', name: 'bg', widget: color, required: false }
              - { label: 'Text', name: 'text', widget: color, required: false }