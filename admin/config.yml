backend:
  name: github
  repo: andrevvm/john-moods
  branch: live
  site_domain: stoic-kalam-384ed4.netlify.com

media_folder: "site/images/uploads"

collections:
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog" # Used in the UI
    folder: "site/_posts/" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: settings
    label: Settings
    create: true
    files:
      - file: site/_data/navigation.yml
        label: Navigation
        name: navigation
        fields:
          - label: Navigation
            name: nav_items
            widget: list
            fields:
              - {label: Label, name: label, widget: string}
              - {label: Path, name: id, hint: "ID for page to open when clicked", widget: string}
              - { label: 'Background', name: 'bg', widget: 'color' }
              - { label: 'Text', name: 'text', widget: 'color' }